name: Build kvm (Windows + macOS)

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

# Cancel obsolete branch builds when a newer commit is pushed.
concurrency:
  group: kvm-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-2025
            target: x86_64-pc-windows-msvc
            artifact: kvm-windows-x64
          - name: macOS Apple Silicon
            os: macos-15
            target: aarch64-apple-darwin
            artifact: kvm-macos-arm64

    steps:
      # checkout@v5 uses Node.js 24 (checkout@v4 uses Node.js 20).
      - name: Check out source
        uses: actions/checkout@v5

      # Composite shell action: installs Rust, not a Node.js runtime.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Show toolchain versions
        shell: bash
        run: |
          rustc --version
          cargo --version

      - name: Run Rust unit tests
        shell: bash
        run: cargo test --target "${{ matrix.target }}"

      - name: Validate Mac installer syntax
        if: runner.os == 'macOS'
        shell: bash
        run: bash -n scripts/macos-local-sign-install.sh

      - name: Build optimized binary
        shell: bash
        run: cargo build --release --target "${{ matrix.target }}"

      - name: Prepare Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/kvm.exe" "dist/kvm.exe"

      - name: Bundle macOS menu bar app and DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          APP="dist/kvm.app"
          mkdir -p "$APP/Contents/MacOS"
          cp "target/${{ matrix.target }}/release/kvm" "$APP/Contents/MacOS/kvm"
          chmod 755 "$APP/Contents/MacOS/kvm"
          cat > "$APP/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>kvm</string>
            <key>CFBundleDisplayName</key><string>kvm</string>
            <key>CFBundleIdentifier</key><string>dev.heavenknows.kvm</string>
            <key>CFBundleExecutable</key><string>kvm</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>0.5.0</string>
            <key>CFBundleVersion</key><string>23</string>
            <key>LSMinimumSystemVersion</key><string>12.0</string>
            <key>LSUIElement</key><true/>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
          plutil -lint "$APP/Contents/Info.plist"
          # Agent mode: no Dock icon; accessible status bar and startup
          # Settings UI are restored in src/macos_tray.rs / src/main.rs.
          test "$(plutil -extract LSUIElement raw -o - "$APP/Contents/Info.plist")" = true
          test ! -f "$APP/Contents/Resources/kvm.icns"
          # Bundle the updater INSIDE the signed app. A user can now update
          # from the already-installed stable-identity application without
          # launching the newly downloaded unsigned/unnotarized script.
          mkdir -p "$APP/Contents/Resources"
          cp scripts/macos-local-sign-install.sh "$APP/Contents/Resources/install-kvm.sh"
          chmod 644 "$APP/Contents/Resources/install-kvm.sh"
          bash -n "$APP/Contents/Resources/install-kvm.sh"
          codesign --force --sign - --timestamp=none "$APP"
          codesign --verify --strict "$APP"
          # The CI signing identity is ephemeral and cannot preserve TCC
          # grants across releases. Ship a self-contained LOCAL installer
          # that generates/reuses one key in the user's login keychain, then
          # re-signs each release with a stable designated requirement.
          # The FIRST install retains standard Finder drag-to-Applications.
          # On first run the app guides one-time local signing. Subsequent
          # updates MUST use its in-app DMG picker to preserve TCC identity.
          # Keep the optional plain .sh as a fallback (not a .command).
          mkdir -p dist/dmg-root
          mv "$APP" dist/dmg-root/kvm.app
          ln -s /Applications "dist/dmg-root/Applications"
          cp scripts/macos-local-sign-install.sh "dist/dmg-root/install-kvm.sh"
          chmod 644 "dist/dmg-root/install-kvm.sh"
          cat > "dist/dmg-root/安装与更新 - READ ME.txt" <<'INSTRUCTIONS'
          kvm (macOS) 安装与更新 / Installation & Updates

          首次安装（支持 Finder 常规拖拽）：
          1. 将本 DMG 的 kvm.app 拖到 Applications（应用程序）。
          2. 从 /Applications/kvm.app 打开 kvm。
          3. 在“概览”页点“完成首次安装”，使本机证书签名固定。
             按提示完成系统管理员或钥匙串授权后会自动重新打开。
          4. 之后再为 kvm 授予一次“辅助功能”权限。
          如 macOS 拦截首次运行，可在确认来源可信后，按系统正常
          安全批准流程打开；不要关闭 Gatekeeper。

          今后升级：
          1. 下载新的 DMG，不要直接拖拽覆盖已经安装的 kvm.app。
          2. 打开旧版 kvm，点“安装更新包…”并选下载的 DMG。
          3. 程序自动退出、重新签署、替换、启动新版；不需要终端。
          直接拖拽覆盖会破坏已建立的稳定签名，可能重置辅助功能授权。

          从 DMG 直接打开新 kvm 时，也可点“安装到应用程序”。
          若图形安装不可用，DMG 保留 install-kvm.sh 备用；
          它不是常规更新步骤。
          没有开发者身份时无法保证首次没有 Gatekeeper 确认。
          若系统明确报告恶意软件，不要绕过该警告。

          English: For first installation, drag kvm.app to Applications.
          Open the installed app, click Finish first installation once
          to set up its stable local signature, then grant Accessibility.
          For LATER UPDATES, open the installed kvm and click Install update,
          choose the new DMG. Do not drag-replace after initial setup.
          INSTRUCTIONS
          test -f "dist/dmg-root/install-kvm.sh"
          test ! -e "dist/dmg-root/Install or Update kvm.command"
          test "$(readlink dist/dmg-root/Applications)" = "/Applications"
          hdiutil create -volname "kvm" -srcfolder "dist/dmg-root" -ov -format UDZO \
            "dist/${{ matrix.artifact }}.dmg"

      # GitHub Artifacts itself downloads as a ZIP. Upload files directly,
      # rather than uploading a ZIP or tar.gz inside another ZIP.
      - name: Upload Windows build
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: dist/kvm.exe
          if-no-files-found: error

      - name: Upload macOS DMG
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}.dmg
          if-no-files-found: error

  # GitHub Actions artifacts are not stable public download URLs. Publish
  # both OS packages ONLY after both platform jobs have passed and uploaded.
  # Release assets can then be fetched by the running app without a GitHub
  # login or a manual DMG download.
  publish:
    name: Publish beta release
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Download tested packages
        uses: actions/download-artifact@v4
        with:
          pattern: kvm-*
          path: release-files
          merge-multiple: true

      - name: Prepare versioned release
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]] ||
            { echo "Unsupported release version: $version" >&2; exit 1; }
          test -s release-files/kvm-macos-arm64.dmg
          test -s release-files/kvm.exe
          cd release-files
          sha256sum kvm-macos-arm64.dmg kvm.exe > SHA256SUMS
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Publish public assets after successful builds
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: kvm ${{ steps.version.outputs.tag }}
          prerelease: true
          draft: false
          generate_release_notes: true
          files: |
            release-files/kvm-macos-arm64.dmg
            release-files/kvm.exe
            release-files/SHA256SUMS
          fail_on_unmatched_files: true
