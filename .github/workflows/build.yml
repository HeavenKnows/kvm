name: Build kvm (Windows + macOS)

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

# Cancel obsolete branch builds when a newer commit is pushed.
concurrency:
  group: kvm-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-2025
            target: x86_64-pc-windows-msvc
            artifact: kvm-windows-x64
          - name: macOS Apple Silicon
            os: macos-15
            target: aarch64-apple-darwin
            artifact: kvm-macos-arm64

    steps:
      # checkout@v5 uses Node.js 24 (checkout@v4 uses Node.js 20).
      - name: Check out source
        uses: actions/checkout@v5

      # Composite shell action: installs Rust, not a Node.js runtime.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Show toolchain versions
        shell: bash
        run: |
          rustc --version
          cargo --version

      - name: Run Rust unit tests
        shell: bash
        run: cargo test --target "${{ matrix.target }}"

      - name: Validate Mac installer syntax
        if: runner.os == 'macOS'
        shell: bash
        run: bash -n scripts/macos-local-sign-install.sh

      - name: Build optimized binary
        shell: bash
        run: cargo build --release --target "${{ matrix.target }}"

      - name: Prepare Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/kvm.exe" "dist/kvm.exe"

      - name: Bundle macOS menu bar app and DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          APP="dist/kvm.app"
          mkdir -p "$APP/Contents/MacOS"
          cp "target/${{ matrix.target }}/release/kvm" "$APP/Contents/MacOS/kvm"
          chmod 755 "$APP/Contents/MacOS/kvm"
          cat > "$APP/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>kvm</string>
            <key>CFBundleDisplayName</key><string>kvm</string>
            <key>CFBundleIdentifier</key><string>dev.heavenknows.kvm</string>
            <key>CFBundleExecutable</key><string>kvm</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>0.5.0</string>
            <key>CFBundleVersion</key><string>21</string>
            <key>LSMinimumSystemVersion</key><string>12.0</string>
            <key>LSUIElement</key><true/>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
          plutil -lint "$APP/Contents/Info.plist"
          # Agent mode: no Dock icon; accessible status bar and startup
          # Settings UI are restored in src/macos_tray.rs / src/main.rs.
          test "$(plutil -extract LSUIElement raw -o - "$APP/Contents/Info.plist")" = true
          test ! -f "$APP/Contents/Resources/kvm.icns"
          # Bundle the updater INSIDE the signed app. A user can now update
          # from the already-installed stable-identity application without
          # launching the newly downloaded unsigned/unnotarized script.
          mkdir -p "$APP/Contents/Resources"
          cp scripts/macos-local-sign-install.sh "$APP/Contents/Resources/install-kvm.sh"
          chmod 644 "$APP/Contents/Resources/install-kvm.sh"
          bash -n "$APP/Contents/Resources/install-kvm.sh"
          codesign --force --sign - --timestamp=none "$APP"
          codesign --verify --strict "$APP"
          # The CI signing identity is ephemeral and cannot preserve TCC
          # grants across releases. Ship a self-contained LOCAL installer
          # that generates/reuses one key in the user's login keychain, then
          # re-signs each release with a stable designated requirement.
          # Finder double-clicking an unnotarized .command script can trigger
          # Gatekeeper's stricter *document* path; Apple documents this as a
          # known issue. Bundle a plain .sh DATA file instead, executed by
          # /bin/bash in Terminal. Do not offer a misleading drag-install link:
          # doing so would overwrite the user's stable personal signature.
          mkdir -p dist/dmg-root
          mv "$APP" dist/dmg-root/kvm.app
          cp scripts/macos-local-sign-install.sh "dist/dmg-root/install-kvm.sh"
          chmod 644 "dist/dmg-root/install-kvm.sh"
          cat > "dist/dmg-root/安装与更新 - READ ME.txt" <<'INSTRUCTIONS'
          kvm (macOS) 安装与更新 / Installation & Updates

          首次安装：
          1. 在 DMG 中打开 kvm.app。如果 macOS 阻止未公证应用，
             可在确认来源后到“系统设置 → 隐私与安全性 → 仍要打开”
             手动批准首次打开；不要关闭 Gatekeeper。
          2. 在 kvm 的“概览”页点击“安装到应用程序”。
          3. 根据系统提示批准登录钥匙串和管理员授权。
             安装成功后新版 kvm 会从 /Applications/kvm.app 启动。

          以后更新：
          1. 从 GitHub Actions 下载新的 DMG，无需双击其中的 App。
          2. 在已安装的 kvm“概览”页点击“安装更新包…”并选择 DMG。
          3. 程序自动退出旧版、签署并替换应用、打开新版。
          不需要终端、双击脚本或拖拽覆盖 app。

          如首次因 Gatekeeper 完全无法打开，DMG 仍提供
          install-kvm.sh 作为备用，可通过 /bin/bash 从终端执行；
          它不是日常升级方式。首次更换代码身份可能再需授权一次。
          没有开发者账号无法消除首次 Gatekeeper 安全确认。
          如系统明确报告恶意软件，不应绕过告警。

          English: Open kvm.app from the DMG and click Install to Applications.
          Subsequent updates: in the INSTALLED kvm app click Install update,
          select the new downloaded DMG; installation/signing happen via the
          native macOS authorization prompt. No Terminal for routine updates.
          Only first-time Gatekeeper approval may be required.
          INSTRUCTIONS
          test -f "dist/dmg-root/install-kvm.sh"
          test ! -e "dist/dmg-root/Install or Update kvm.command"
          test ! -L "dist/dmg-root/Applications"
          hdiutil create -volname "kvm" -srcfolder "dist/dmg-root" -ov -format UDZO \
            "dist/${{ matrix.artifact }}.dmg"

      # GitHub Artifacts itself downloads as a ZIP. Upload files directly,
      # rather than uploading a ZIP or tar.gz inside another ZIP.
      - name: Upload Windows build
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: dist/kvm.exe
          if-no-files-found: error

      - name: Upload macOS DMG
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}.dmg
          if-no-files-found: error
