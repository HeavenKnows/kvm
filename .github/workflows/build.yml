name: Build kvm (Windows + macOS)

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-2025
            target: x86_64-pc-windows-msvc
            artifact: kvm-windows-x64
          - name: macOS Apple Silicon
            os: macos-15
            target: aarch64-apple-darwin
            artifact: kvm-macos-arm64
          - name: macOS Intel
            os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: kvm-macos-intel

    steps:
      # checkout@v5 uses Node.js 24 (checkout@v4 uses Node.js 20).
      - name: Check out source
        uses: actions/checkout@v5

      # Composite shell action: installs Rust, not a Node.js runtime.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Show toolchain versions
        shell: bash
        run: |
          rustc --version
          cargo --version

      - name: Run Rust unit tests
        shell: bash
        run: cargo test --target "${{ matrix.target }}"

      - name: Build optimized binary
        shell: bash
        run: cargo build --release --target "${{ matrix.target }}"

      - name: Package Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/kvm.exe" "dist/kvm.exe"
          Compress-Archive -Path "dist/kvm.exe" -DestinationPath "${{ matrix.artifact }}.zip" -Force

      - name: Package macOS executable
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/kvm" dist/kvm
          chmod +x dist/kvm
          tar -czf "${{ matrix.artifact }}.tar.gz" -C dist kvm

      # upload-artifact@v6 runs on Node.js 24 (v4 is not suitable).
      - name: Upload Windows build
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip
          if-no-files-found: error

      - name: Upload macOS build
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz
          if-no-files-found: error
