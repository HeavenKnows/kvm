name: Build kvm (Windows + macOS)

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

# Cancel obsolete branch builds when a newer commit is pushed.
concurrency:
  group: kvm-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-2025
            target: x86_64-pc-windows-msvc
            artifact: kvm-windows-x64
          - name: macOS Apple Silicon
            os: macos-15
            target: aarch64-apple-darwin
            artifact: kvm-macos-arm64

    steps:
      # checkout@v5 uses Node.js 24 (checkout@v4 uses Node.js 20).
      - name: Check out source
        uses: actions/checkout@v5

      # Composite shell action: installs Rust, not a Node.js runtime.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Show toolchain versions
        shell: bash
        run: |
          rustc --version
          cargo --version

      - name: Run Rust unit tests
        shell: bash
        run: cargo test --target "${{ matrix.target }}"

      - name: Build optimized binary
        shell: bash
        run: cargo build --release --target "${{ matrix.target }}"

      - name: Prepare Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/kvm.exe" "dist/kvm.exe"

      - name: Bundle macOS menu bar app and DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          APP="dist/kvm.app"
          mkdir -p "$APP/Contents/MacOS"
          cp "target/${{ matrix.target }}/release/kvm" "$APP/Contents/MacOS/kvm"
          chmod 755 "$APP/Contents/MacOS/kvm"
          cat > "$APP/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>kvm</string>
            <key>CFBundleDisplayName</key><string>kvm</string>
            <key>CFBundleIdentifier</key><string>dev.heavenknows.kvm</string>
            <key>CFBundleExecutable</key><string>kvm</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>0.5.0</string>
            <key>CFBundleVersion</key><string>10</string>
            <key>LSMinimumSystemVersion</key><string>12.0</string>
            <key>LSUIElement</key><true/>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
          plutil -lint "$APP/Contents/Info.plist"
          # Agent mode: no Dock icon; accessible status bar and startup
          # Settings UI are restored in src/macos_tray.rs / src/main.rs.
          test "$(plutil -extract LSUIElement raw -o - "$APP/Contents/Info.plist")" = true
          test ! -f "$APP/Contents/Resources/kvm.icns"
          codesign --force --sign - --timestamp=none "$APP"
          # Conventional drag-to-Applications DMG. Finder shows kvm.app
          # alongside a symlink to the system Applications folder.
          mkdir -p dist/dmg-root
          mv "$APP" dist/dmg-root/kvm.app
          ln -s /Applications dist/dmg-root/Applications
          hdiutil create -volname "kvm" -srcfolder "dist/dmg-root" -ov -format UDZO \
            "dist/${{ matrix.artifact }}.dmg"

      # GitHub Artifacts itself downloads as a ZIP. Upload files directly,
      # rather than uploading a ZIP or tar.gz inside another ZIP.
      - name: Upload Windows build
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: dist/kvm.exe
          if-no-files-found: error

      - name: Upload macOS DMG
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}.dmg
          if-no-files-found: error
