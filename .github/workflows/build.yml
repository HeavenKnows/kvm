name: Build CrossKey (Windows + macOS)

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-2025
            target: x86_64-pc-windows-msvc
            artifact: crosskey-windows-x64
          - name: macOS Apple Silicon
            os: macos-15
            target: aarch64-apple-darwin
            artifact: crosskey-macos-arm64
          - name: macOS Intel
            os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: crosskey-macos-intel

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build optimized binary
        shell: bash
        run: cargo build --release --target "${{ matrix.target }}"

      - name: Package Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/crosskey.exe" "dist/crosskey.exe"
          Compress-Archive -Path "dist/crosskey.exe" -DestinationPath "${{ matrix.artifact }}.zip" -Force

      - name: Package macOS executable
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/crosskey" dist/crosskey
          chmod +x dist/crosskey
          tar -czf "${{ matrix.artifact }}.tar.gz" -C dist crosskey

      - name: Upload Windows build
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip
          if-no-files-found: error

      - name: Upload macOS build
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz
          if-no-files-found: error
