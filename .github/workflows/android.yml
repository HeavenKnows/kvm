name: Build Android receiver (Ocean5 Pro / API 34)

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kvm-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Build Android 14 APK and unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android 14 SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Run unit tests and build debug APK
        run: gradle --no-daemon -p android testDebugUnitTest assembleDebug
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v6
        with:
          name: kvm-android-ocean5pro-api34-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
