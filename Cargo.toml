[package]
name = "kvm"
version = "0.5.0-beta.13"
edition = "2021"
license = "MIT"
description = "Experimental pure-Rust software KVM for Windows and macOS"

[dependencies]
arboard = "3.6"
eframe = { version = "0.32", default-features = true }
rdev = { version = "0.5.3", features = ["serialize", "unstable_grab"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"
snow = "0.10"
sha2 = "0.10"
rand = "0.8"
dirs = "6"
if-addrs = "0.15"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = { version = "0.25.0", features = ["highsierra"] }
core-foundation = "0.10.0"
tray-icon = "0.26.1"
objc = "0.2.7"

